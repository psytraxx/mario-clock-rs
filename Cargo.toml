[package]
name = "super-mario-clock"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { version = "0.9.2", default-features = false, features = [
    "log",
    "alloc",
    "small_rng",
] }
esp-hal = { version = "=1.0.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32s3",
    "log-04",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
log = "0.4.28"

embassy-net = { version = "0.7.1", features = [
    "dhcpv4",
    "log",
    "tcp",
    "udp",
    "dns",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.17.0", features = [
    "esp-alloc",
    "esp32s3",
    "log-04",
    "unstable",
    "wifi",
] }

embassy-sync = { version = "0.7.2", features = [] }
static_cell = "2.1.1"
heapless = "0.9.1"
esp-hub75 = { version = "0.8.0", features = ["esp32s3", "log"] }
embedded-graphics = { version = "0.8.1", features = [] }
embedded-hal = { version = "1.0.0", features = [] }
pcf8563 = { git = "https://github.com/invpt/pcf8563-rs.git", branch = "main" }
sntpc = { version = "0.6.1", default-features = false, features = [
    "embassy-socket",
    "log",
] }
chrono = { version = "0.4.42", default-features = false }
chrono-tz = { version = "0.10.4", default-features = false }
micromath = { version = "2.1.0", default-features = false, features = [
    "num-traits",
] }
embassy-futures = { version = "0.1.2", features = ["log"] }
esp-phy = { version = "0.1.1", features = ["esp32s3", "log-04"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
