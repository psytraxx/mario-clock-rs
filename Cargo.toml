[package]
name = "super-mario-clock"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-println = { version = "0.15.0", features = ["esp32s3", "log-04"] }
embassy-sync = { version = "0.7.0", features = [] }
embassy-time = { version = "0.5.0", features = [] }
static_cell = "2.1.0"
embassy-executor = { version = "0.9.0", features = ["task-arena-size-12288"] }
heapless = { version = "0.9.0", default-features = false }
esp-hal-embassy = { version = "0.9.0", features = ["esp32s3"] }
esp-hal = { version = "1.0.0-beta.1", features = [
    "esp32s3",
    "unstable",
    "log-04",
] }
esp-hub75 = { version = "0.6.0", features = ["esp32s3", "log"] }
esp-wifi = { version = "0.15.0", features = ["esp32s3", "wifi"] }
esp-alloc = { version = "0.8.0" }
esp-backtrace = { version = "0.17.0", features = [
    "esp32s3",
    "exception-handler",
    "panic-handler",
    "println",
] }
embedded-graphics = { version = "0.8.1", features = [] }
embedded-hal = { version = "1.0.0", features = [] }
embassy-net = { version = "0.7.0", features = [
    "tcp",
    "udp",
    "dns",
    "dhcpv4",
    "dhcpv4-hostname",
] }
pcf8563 = { git = "https://github.com/invpt/pcf8563-rs.git", branch = "main" }
sntpc = { version = "0.6.0", default-features = false, features = [
    "embassy-socket",
    "log",
] }
chrono = { version = "0.4.41", default-features = false }
chrono-tz = { version = "0.10.3", default-features = false }
log = "0.4.27"
embassy-futures = { version = "0.1.1", features = ["log"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
